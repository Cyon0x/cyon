<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cyon — social card</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/public/fonts/geist-variable.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument";
        src: url("/public/fonts/instrument-serif-regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument";
        src: url("/public/fonts/instrument-serif-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains";
        src: url("/public/fonts/jetbrains-mono-variable.woff2") format("woff2");
        font-weight: 100 800;
        font-display: block;
      }

      :root {
        --bg: #07080a;
        --ink: #edeef0;
        --ink-2: #98a0aa;
        --ink-3: #5d6570;
        --signal: #c9ff4d;
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--bg);
        color: var(--ink);
        font-family: Geist, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .glow {
        position: absolute;
        left: -240px;
        top: -420px;
        width: 1020px;
        height: 1020px;
        background: radial-gradient(circle, rgba(201, 255, 77, 0.15), rgba(7, 8, 10, 0) 62%);
      }

      .glow-b {
        position: absolute;
        right: -300px;
        bottom: -420px;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(86, 225, 255, 0.1), rgba(7, 8, 10, 0) 60%);
      }

      .frame {
        position: absolute;
        inset: 0;
        padding: 54px 64px 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .mono {
        font-family: JetBrains, ui-monospace, monospace;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .who {
        color: var(--ink);
      }

      .who span {
        color: var(--ink-3);
        margin-left: 14px;
      }

      .spacer {
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, var(--line), rgba(255, 255, 255, 0));
      }

      .stamp {
        color: var(--ink-2);
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      h1 {
        font-size: 74px;
        font-weight: 700;
        line-height: 0.96;
        letter-spacing: -0.035em;
        text-transform: uppercase;
      }

      .serif {
        font-family: Instrument, Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: 92px;
        line-height: 0.94;
        letter-spacing: -0.02em;
        padding-left: 26px;
      }

      .both {
        position: relative;
        color: var(--signal);
        display: inline-block;
      }

      .both::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 4px;
        width: 100%;
        height: 4px;
        background: rgba(201, 255, 77, 0.3);
      }

      footer {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--ink-2);
      }

      .handle {
        color: var(--ink);
      }

      .url {
        color: var(--ink-3);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="glow-b"></div>

    <div class="frame">
      <header>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 3h18v13l-5 5H3V3z" stroke="#edeef0" stroke-width="1.4" opacity="0.55" />
          <circle cx="12" cy="10.5" r="2.6" fill="#c9ff4d" />
          <path d="M3 16.2h13.2" stroke="#edeef0" stroke-width="1.4" opacity="0.35" />
        </svg>
        <span class="mono who">Cyon<span>Eghosa Imasuen</span></span>
        <span class="spacer"></span>
        <span class="mono stamp">Sys / 01 — Workspace</span>
      </header>

      <main>
        <h1>Build the product.</h1>
        <div class="serif">grow the ecosystem.</div>
        <h1>Ship <span class="both">both.</span></h1>
      </main>

      <footer class="mono">
        <span>Web3 builder — product / growth / community / ecosystems</span>
        <span class="spacer"></span>
        <span class="handle">@Cyon0x</span>
        <span class="url">cyon-workspace.vercel.app</span>
      </footer>
    </div>
  </body>
</html>
